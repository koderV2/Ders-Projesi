<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon MainQuest</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    
    <header class="main-header">
        <h2 class="game-title">Dungeon<br>MainQuest</h2>
    </header>
    
    <div id="game-container">
        <div id="statusMsg"></div>

        <button id="str" class="btn-primary" type="button" onclick="handleStart()">START GAME</button>

        <div id="nameArea" class="hidden">
            <input id="nameInput" type="text" placeholder="Enter your adventurer name...">
            <button class="btn-confirm" onclick="handleNameConfirm()">CONFIRM</button>
        </div>

        <div id="selectionArea" class="hidden">
            <button id="characterBtn" class="btn-selection" onclick="showCharacters()">CHOOSE YOUR CHARACTER</button>
            <div id="charList" class="hidden">
                <button class="btn-char" onclick="handleCharSelect('alpha')">ALPHA</button>
                <button class="btn-char" onclick="handleCharSelect('beta')">BETA</button>
                <button class="btn-char" onclick="handleCharSelect('gama')">GAMMA</button>
            </div>
        </div>

        <div id="skillArea"></div>

        <div id="infoPanel">
            <h3 id="charInfH"></h3>
            <p id="chaarInfP"></p>
            <button id="nextStepBtn" class="btn-quest" onclick="goToNextLevel()">
                <b>CONFIRM & START QUEST</b>
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
