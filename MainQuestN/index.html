<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Quest - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <style>

        .content-area {
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        .main-hero {
            position: relative;
            width: 100%;
            height: 400px;
            border: 2px solid var(--accent-color);
            background-image: url('menu.png'); /* Placeholder resim */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff; 
        }

        .hero-title {
            font-size: 5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .start-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: var(--font-family);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Main Quest</h1>
        <button class="characters-btn">Characters</button>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <a href="game_story.html" class="sidebar-btn">Game Story</a>
            <a href="characters.html" class="sidebar-btn">Characters Story</a>
            <a href="world_map.html" class="sidebar-btn">Map</a>
            <a href="level_system.html" class="sidebar-btn">Level System</a>
        </nav>

        <main class="content-area">
            <div class="main-hero">
                <h2 class="hero-title">Main Quest</h2>
                <button class="start-btn">Start</button>
            </div>
        </main>
    </div>

</body>
</html>
